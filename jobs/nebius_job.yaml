# Nebius Serverless Jobs: parallel differential-testing sweep.
#
# Each replica takes a stride-partitioned slice of benchmarks/programs and runs
# the full translate -> test -> diff -> repair loop over it. Scaling replicas is
# how a sweep over hundreds of programs finishes in minutes rather than hours.
#
# Submit with:
#   nebius compute job create --file jobs/nebius_job.yaml
# (verify the exact subcommand against your CLI version; the fields below are
# the ones the job needs regardless of the wrapper.)

name: rosetta-equivalence-sweep
description: COBOL to Python migration with differential equivalence proof

spec:
  # One replica per shard. ROSETTA_SHARD_INDEX must be the replica ordinal.
  parallelism: 8
  completions: 8

  container:
    image: rosetta-sandbox:latest
    command: ["python3", "jobs/run_shard.py"]
    workingDir: /app

  resources:
    # The sweep is API-latency and subprocess bound, not GPU bound: inference
    # happens in Token Factory, so the job replicas stay cheap CPU workers.
    cpu: 4
    memoryGb: 8

  env:
    - name: ROSETTA_SHARD_COUNT
      value: "8"
    - name: ROSETTA_PROGRAMS_DIR
      value: "benchmarks/programs"
    - name: ROSETTA_OUTPUT_DIR
      value: "/output"
    - name: ROSETTA_SANDBOX
      value: "local"        # GnuCOBOL is already in this image
    - name: ROSETTA_TEST_VECTORS
      value: "40"
    - name: ROSETTA_MAX_REPAIR_ITERS
      value: "3"
    - name: NEBIUS_BASE_URL
      value: "https://api.studio.nebius.com/v1"
    - name: NEBIUS_API_KEY
      valueFrom:
        secretKeyRef:
          name: nebius-token-factory
          key: api-key

  outputs:
    - mountPath: /output
