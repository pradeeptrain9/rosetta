[project]
name = "rosetta-migrate"
version = "0.1.0"
description = "Legacy COBOL to Python migration with machine-checked behavioural equivalence, powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.40.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
rosetta = "rosetta.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rosetta*"]
